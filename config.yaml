# =====================================================================
#  Bio + AI Briefing — settings
#  Edit this file on GitHub (pencil icon) to tune the show. Changes take
#  effect on the next run. Lines starting with # are comments.
# =====================================================================

show:
  title: "Bio + AI Briefing"
  author: "Personal briefing"
  description: >-
    A daily AI-generated audio briefing on biotech and pharma, biology and
    biomedical research, computational biology, and AI. It favors work that
    has held up for a few weeks: widely cited, widely covered, or heavily
    discussed. Show notes link every source and include a transcript.
  language: "en-us"
  timezone: "UTC"            # used for the date in episode titles, e.g. "America/New_York"
  site_url: ""               # leave blank to use https://<user>.github.io/<repo>/

# What the editor should look for. Plain English; edit freely.
editorial_brief: >-
  The listener follows biotech and pharma; biology and biomedical research;
  computational biology and bioinformatics; and AI, both the biggest general
  developments and AI applied to biology, medicine, biotech and pharma. They
  also like striking breakthroughs in the non-biological sciences (physics,
  astronomy, chemistry, materials, earth and climate science, mathematics),
  and occasional high-impact essays or blog posts on these topics.
  They want things that have been vetted by time (widely cited, widely
  covered, or heavily discussed), not yesterday's firehose, and they value
  precision and evidence over hype.
  Preferred mix per episode: 1-2 biotech/pharma stories, 2-3 biology or
  biomedical research findings, 1 computational biology or bioinformatics
  item, 1-2 AI-for-biology/medicine items, 1 major general AI development,
  1 breakthrough in a non-biological science, and occasionally 1 essay or
  blog post. Covering each category is strongly preferred but optional: if a
  category has nothing genuinely strong today, skip it rather than fill it
  with a weak item or relabel an item from another category to fit.

episode:
  target_minutes: 12         # maximum spoken length; ~150 words per minute
  min_items: 4               # if fewer good items exist, the episode is shorter
  max_items: 9
  keep_episodes: 30          # older episodes are removed from the feed and GitHub

# The "has it held up?" lag. An item is normally eligible only when its age
# (days since publication) is inside this window.
windows:
  papers:      {min_age_days: 21, max_age_days: 100}   # journals + preprints (OpenAlex); citations need time
  ai_papers:   {min_age_days: 10, max_age_days: 30}    # ML papers ranked by Hugging Face upvotes
  news:        {min_age_days: 10, max_age_days: 30, warmup: false}   # news outlets (RSS); warmup: true
                                                     # lets fresher news in while the archive fills
  blogs:       {min_age_days: 7,  max_age_days: 30}    # blogs/essays (RSS)
  hacker_news: {min_age_days: 10, max_age_days: 30}    # Hacker News discussion

# Fast track: items younger than the window's minimum (but at least
# min_age_days old) get in only with exceptional traction — any ONE of these.
# Papers from OpenAlex are not fast-tracked (they have no citations yet), but a
# paper covered widely in the news can come in through its news story.
fast_track:
  enabled: true
  min_age_days: 5
  min_outlet_types: 3          # news story covered by 3+ distinct outlet types
  hn_min_points_ai: 600        # AI stories on Hacker News
  hn_min_points_science: 400   # bio/science stories on Hacker News
  hf_min_upvotes: 150          # Hugging Face daily-papers upvotes

# Thresholds for "discussed a lot"
signals:
  hn_min_points_ai: 300        # AI stories on Hacker News
  hn_min_points_science: 150   # bio/science stories on Hacker News
  hf_min_upvotes: 40           # Hugging Face daily-papers upvotes
  papers_per_stream: 25        # top papers kept from each OpenAlex query
  max_news_headlines: 4500     # cap on headlines sent to the news-clustering step

# Scholarly papers come from OpenAlex. Each stream fetches the 200 most-cited
# works in the window, re-ranks them by citations plus citation velocity, and
# keeps the top papers_per_stream.
# Filters use OpenAlex syntax: https://developers.openalex.org/guides/filtering
# Field ids: 11 Agri/Bio sciences, 13 Biochem/Genetics/Mol bio, 17 Computer
# science, 24 Immunology/Microbiology, 27 Medicine, 28 Neuroscience,
# 30 Pharmacology. Domain ids: 1 Life sciences, 2 Social sciences,
# 3 Physical sciences, 4 Health sciences. Journal filters use ISSNs; the run
# summary lists any ISSN that matched nothing, so a typo shows up there.
openalex:
  types: "article|preprint"
  streams:
    - name: "Biology & life sciences"
      category: bio_biomed_research
      filter: "primary_topic.field.id:13|24|28|11"
    - name: "Medicine & pharmacology"
      category: bio_biomed_research
      filter: "primary_topic.field.id:27|30"
    - name: "Computational methods in biology/medicine"
      category: compbio_bioinformatics
      filter: "primary_topic.field.id:13|24|27|28|30,topics.field.id:17"
    - name: "Machine learning applied to biology/medicine"
      category: ai_for_bio_med
      filter: "primary_topic.field.id:17,topics.field.id:13|24|27|28|30"
    # Top journals get their own streams so they compete with each other rather
    # than with the whole field.
    # Nature, Science, Cell, NEJM, Lancet, JAMA, Nature Medicine, Science Translational Medicine
    # (life- and health-science papers only).
    - name: "Top journals: biomedical & clinical"
      category: bio_biomed_research
      filter: "primary_location.source.issn:0028-0836|1476-4687|0036-8075|1095-9203|0092-8674|1097-4172|0028-4793|1533-4406|0140-6736|1474-547X|0098-7484|1538-3598|1078-8956|1546-170X|1946-6234|1946-6242,primary_topic.domain.id:1|4"
    # Nature Biotechnology, Nature Methods, Nature Genetics, Genome Biology, Genome Research,
    # Cell Genomics, Cell Systems, Nature Computational Science.
    - name: "Top journals: genomics, methods & computational biology"
      category: compbio_bioinformatics
      filter: "primary_location.source.issn:1087-0156|1546-1696|1548-7091|1548-7105|1061-4036|1546-1718|1474-760X|1465-6906|1088-9051|1549-5469|2666-979X|2405-4712|2662-8457"
    # Nature, Science, PNAS, PRL, and Nature Physics / Chemistry / Materials / Astronomy /
    # Geoscience / Climate Change. Physical-science papers only (domain 3), excluding
    # computer science (AI comes in through Hugging Face, Hacker News, and news).
    - name: "Top journals: non-biological science"
      category: science_breakthroughs
      filter: "primary_location.source.issn:0028-0836|1476-4687|0036-8075|1095-9203|0027-8424|1091-6490|0031-9007|1079-7114|1745-2473|1745-2481|1755-4330|1755-4349|1476-1122|1476-4660|2397-3366|1752-0894|1752-0908|1758-678X|1758-6798,primary_topic.domain.id:3,primary_topic.field.id:!17"

# RSS feeds. kind: news | blog.  filter: bio_ai keeps only items whose
# title/summary mentions biology, medicine, or AI (useful for general outlets).
# For news feeds, outlet_type groups outlets so that five trade outlets
# covering the same deal count as one kind of coverage, not five:
#   trade    - biotech, pharma and health trade press
#   science  - science journalism
#   general  - general-audience newspapers and broadcasters
#   tech     - technology press
# outlet: set when several feeds belong to one outlet (e.g. NYT Science + Health).
# If a feed breaks, the run summary on GitHub lists it; fix or delete the line.
# AI-lab blogs are deliberately not included: lab announcements come in through
# Hacker News and news coverage, so every lab is judged the same way.
feeds:
  # --- biotech, pharma & health trade press
  - {name: "STAT", url: "https://www.statnews.com/feed/", kind: news, outlet_type: trade}
  - {name: "Endpoints News", url: "https://endpoints.news/feed/", kind: news, outlet_type: trade}
  - {name: "Fierce Biotech", url: "https://www.fiercebiotech.com/rss/xml", kind: news, outlet_type: trade}
  - {name: "BioPharma Dive", url: "https://www.biopharmadive.com/feeds/news/", kind: news, outlet_type: trade}
  - {name: "GEN", url: "https://www.genengnews.com/feed/", kind: news, outlet_type: trade}
  # --- science journalism
  - {name: "Science (news)", url: "https://www.science.org/rss/news_current.xml", kind: news, outlet_type: science}
  # Nature research papers (URLs with /s41586-) are skipped here; they come through OpenAlex with citations.
  - {name: "Nature", url: "https://www.nature.com/nature.rss", kind: news, outlet_type: science, exclude: "/articles/s41586-"}
  - {name: "Quanta Magazine", url: "https://www.quantamagazine.org/feed/", kind: news, outlet_type: science}
  - {name: "Science News", url: "https://www.sciencenews.org/feed", kind: news, outlet_type: science}
  - {name: "Ars Technica Science", url: "https://feeds.arstechnica.com/arstechnica/science", kind: news, outlet_type: science}
  # --- general-audience press
  - {name: "NYT Science", url: "https://rss.nytimes.com/services/xml/rss/nyt/Science.xml", kind: news, outlet_type: general, outlet: "New York Times"}
  - {name: "NYT Health", url: "https://rss.nytimes.com/services/xml/rss/nyt/Health.xml", kind: news, outlet_type: general, outlet: "New York Times"}
  - {name: "Guardian Science", url: "https://www.theguardian.com/science/rss", kind: news, outlet_type: general}
  - {name: "BBC Science", url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml", kind: news, outlet_type: general}
  - {name: "NPR Science", url: "https://feeds.npr.org/1007/rss.xml", kind: news, outlet_type: general, outlet: "NPR"}
  - {name: "NPR Health", url: "https://feeds.npr.org/1128/rss.xml", kind: news, outlet_type: general, outlet: "NPR"}
  # --- technology press (AI coverage)
  - {name: "MIT Technology Review", url: "https://www.technologyreview.com/feed/", kind: news, outlet_type: tech, filter: bio_ai}
  - {name: "The Verge (AI)", url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", kind: news, outlet_type: tech}
  - {name: "Wired (AI)", url: "https://www.wired.com/feed/tag/ai/latest/rss", kind: news, outlet_type: tech}
  # --- blogs & essays
  - {name: "In the Pipeline (Derek Lowe)", url: "https://www.science.org/blogs/pipeline/feed", kind: blog}
  - {name: "Ground Truths (Eric Topol)", url: "https://erictopol.substack.com/feed", kind: blog}
  - {name: "Asimov Press", url: "https://www.asimov.press/feed", kind: blog}
  - {name: "Owl Posting", url: "https://www.owlposting.com/feed", kind: blog}
  - {name: "LifeSciVC (Bruce Booth)", url: "https://lifescivc.com/feed/", kind: blog}
  - {name: "Paired Ends (Stephen Turner)", url: "https://blog.stephenturner.us/feed", kind: blog}
  - {name: "Bits of DNA (Lior Pachter)", url: "https://liorpachter.wordpress.com/feed/", kind: blog}
  - {name: "Import AI (Jack Clark)", url: "https://importai.substack.com/feed", kind: blog}
  - {name: "Simon Willison", url: "https://simonwillison.net/atom/everything/", kind: blog, filter: bio_ai}
  - {name: "Interconnects (Nathan Lambert)", url: "https://www.interconnects.ai/feed", kind: blog}

models:
  editor: "claude-sonnet-5"                 # picks the stories and writes the script
  triage: "claude-haiku-4-5-20251001"       # groups news headlines into stories (cheap)
  effort: "medium"                          # low | medium | high — thinking depth for the editor/writer

tts:
  model: "gpt-4o-mini-tts"
  voice: "marin"             # others: cedar, coral, sage, alloy, ash, ballad, echo, fable, nova, onyx, shimmer, verse
  instructions: >-
    Calm, clear, and warm, like a public-radio science host. Moderate pace.
    Pronounce scientific and drug names carefully.
  bitrate: "64k"             # mono; ~0.5 MB per minute

# Used only to print an estimated cost per run in the GitHub summary (USD).
pricing:
  claude-sonnet-5: {input_per_mtok: 2.0, output_per_mtok: 10.0}
  claude-haiku-4-5-20251001: {input_per_mtok: 1.0, output_per_mtok: 5.0}
  tts_per_minute: 0.015
